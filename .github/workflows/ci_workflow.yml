# Workflow name displayed in the GitHub Actions tab
name: Node.js CI Workflow

# Defines when the GitHub Actions workflow can be started
on:
  # Allows the workflow to be triggered manually from the GitHub Actions UI
  workflow_dispatch:

# Jobs define what the workflow will execute
jobs:
  # Name of the job
  build:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    # Steps are executed sequentially
    steps:
      # Checkout the repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install and configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node.js version used for this workflow
          node-version: "20"

      # Install project dependencies from package.json
      - name: Install dependencies
        run: npm install

      # Run automated tests
      - name: Run tests
        run: npm test

      # Build the application for production
      - name: Build project
        run: npm run build

      # Store the build output as a downloadable artifact
      - name: Archive production artifacts
        uses: actions/upload-artifact@v2
        with:
          # Artifact name in GitHub Actions
          name: build

          # Directory containing the production-ready files
          path: build/